name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download deps
        run: go mod download

      - name: Vet & Test
        run: |
          go vet ./...
          go test ./... -count=1

      - name: Compute version
        id: ver
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build all platforms
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=${VERSION}"
          # linux/amd64
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "${LDFLAGS}" -o dist/easypub-linux-amd64       ./cmd/easypub
          # linux/arm64
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags "${LDFLAGS}" -o dist/easypub-linux-arm64       ./cmd/easypub
          # windows/amd64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "${LDFLAGS}" -o dist/easypub-windows-amd64.exe ./cmd/easypub
          # darwin/amd64
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -trimpath -ldflags "${LDFLAGS}" -o dist/easypub-darwin-amd64      ./cmd/easypub
          # darwin/arm64
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags "${LDFLAGS}" -o dist/easypub-darwin-arm64      ./cmd/easypub

      - name: Smoke check
        run: |
          file dist/easypub-linux-amd64
          file dist/easypub-linux-arm64
          file dist/easypub-darwin-arm64
          dist/easypub-linux-amd64 -version

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum easypub-* > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Create GitHub Release
        id: rel
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.ver.outputs.version }}
          tag_name: ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/easypub-linux-amd64
            dist/easypub-linux-arm64
            dist/easypub-windows-amd64.exe
            dist/easypub-darwin-amd64
            dist/easypub-darwin-arm64
            dist/checksums-sha256.txt
