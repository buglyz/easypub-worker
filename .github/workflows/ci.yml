name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Test & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download deps
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

  build-cross:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            artifact: easypub-linux-amd64
          - os: linux
            arch: arm64
            artifact: easypub-linux-arm64
          - os: windows
            arch: amd64
            artifact: easypub-windows-amd64.exe
          - os: darwin
            arch: amd64
            artifact: easypub-darwin-amd64
          - os: darwin
            arch: arm64
            artifact: easypub-darwin-arm64
          - os: darwin
            arch: amd64
            artifact: easypub-darwin-amd64
          - os: darwin
            arch: arm64
            artifact: easypub-darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME:-dev}-${GITHUB_SHA::7}" \
            -o ${{ matrix.artifact }} ./cmd/easypub

      - name: Smoke test (POSIX)
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: file ${{ matrix.artifact }} && ./${{ matrix.artifact }} -version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
