name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Verify local-worker bundle is up to date
        run: |
          npm run build:local
          git diff --ignore-cr-at-eol --exit-code src/static/local-worker.js
