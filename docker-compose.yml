# 本地一键启动 WebUI
#   docker compose up -d
#   浏览器打开 http://127.0.0.1:8080
#
# 注意：WebUI 默认无鉴权。公网暴露请加反向代理鉴权。

services:
  easypub:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: easypub:local
    container_name: easypub
    ports:
      - "8080:8080"
    volumes:
      # 持久化输出与可选 config.xml / ereaders.xml
      - ./data:/data
    restart: unless-stopped
    # 如需覆盖默认命令，例如只跑 CLI：
    # entrypoint: ["/usr/local/bin/easypub"]
    # command: ["-i", "/data/book.txt", "-o", "/data/book.epub"]
